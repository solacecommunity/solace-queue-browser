name: SCA Scan
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Lets the scan be re-run against trunk without waiting for a push. Needed
  # because a merge commit carrying [skip ci] in its body produces no run at
  # all, which leaves the repo scanned-but-unregistered (DATAGO-150669).
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  packages: read
  actions: read
  statuses: write
  checks: write
  pull-requests: write

jobs:
  sca_scan:
    uses: SolaceDev/solace-public-workflows/.github/workflows/sca-scan-and-guard.yaml@main
    with:
      additional_scan_params: |
        fossa.config=.github/.fossa.yml
      node_version: "24"
      setup_actions: '["setup-node"]'
    secrets:
      FOSSA_API_KEY: ${{ secrets.FOSSA_API_KEY }}

  update_manifest:
    needs: sca_scan
    # The manifest records what landed on the default branch, so it must never
    # be written from a PR run -- the scan still runs, the write does not.
    # workflow_dispatch is allowed through because a dispatched run against
    # trunk is exactly how a [skip ci] merge gets registered after the fact;
    # the default-branch check still gates the write either way.
    if: >-
      needs.sca_scan.result == 'success'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      packages: read
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.MANIFEST_AWS_ROLE }}
          aws-region: us-east-1

      - name: Update solace-cloud-manifest
        uses: SolaceDev/solace-public-workflows/.github/actions/cicd-helper@main
        with:
          rc_step: add_item_from_json_to_dynamodb_table
          ddb_table_name: solace-cloud-manifest
          ddb_partition_key: squad
          ddb_sort_key: repository
          ddb_item_to_be_added: |
            {
              "squad": "prof-services",
              "repository": "${{ github.event.repository.name }}",
              "dev": {
                "sha": "${{ github.sha }}",
                "version": "${{ github.ref_name }}"
              }
            }
